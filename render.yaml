services:
  - type: web
    name: vertical-demos
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # set this in the Render dashboard, do not commit it
      - key: PYTHON_VERSION
        value: "3.12.4"
