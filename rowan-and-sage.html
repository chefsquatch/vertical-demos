document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"width:11px;height:11px;border-radius:50%;background:#b9c2a6;\"><\u002Fspan>\n            <div style=\"margin-left:auto;display:flex;gap:6px;font-size:13px;\">\n              <span style=\"background:#3b1f2b;color:#f3e9da;padding:5px 12px;border-radius:16px;\">This week<\u002Fspan>\n              <span style=\"padding:5px 12px;color:#6d5a55;\">Staff<\u002Fspan>\n              <span style=\"padding:5px 12px;color:#6d5a55;\">Waitlist<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px 20px 8px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;\">\n              <div style=\"font-family:Cormorant,serif;font-weight:500;font-size:28px;\">Bookings<\u002Fdiv>\n              <div style=\"font-size:13px;color:#6d5a55;\">Tap any row to edit, move or reassign<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto;\">\n              <div style=\"min-width:500px;display:flex;flex-direction:column;\">\n                <div style=\"display:grid;grid-template-columns:1fr 1.2fr .8fr 1fr 118px;gap:10px;padding:8px 12px;font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#8a6a5a;\">\n                  <span>Client<\u002Fspan><span>Service<\u002Fspan><span>Stylist<\u002Fspan><span>When<\u002Fspan><span>Status<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:1fr 1.2fr .8fr 1fr 118px;gap:10px;align-items:center;padding:12px;border-top:1px solid #ece0cf;font-size:14.5px;background:{{ r.rowBg }};animation:rise .4s ease;cursor:pointer;\" style-hover=\"background:#f3e9da;\">\n                    <b style=\"font-weight:600;\">{{ r.client }}<\u002Fb><span>{{ r.svc }}<\u002Fspan><span>{{ r.who }}<\u002Fspan><span style=\"text-decoration:{{ r.strike }};\">{{ r.when }}<\u002Fspan>\n                    <span style=\"justify-self:start;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:14px;background:{{ r.bg }};color:{{ r.fg }};\">{{ r.status }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:16px 20px 20px;border-top:1px solid #e2d2bd;background:#f7efe3;\">\n            <div style=\"font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#8a6a5a;margin-bottom:10px;\">Sent automatically<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;\">\n              <sc-for list=\"{{ syncs }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:10px;background:#fbf6ee;border:1px solid #e2d2bd;border-radius:16px;padding:10px 13px;\">\n                  <span style=\"width:9px;height:9px;border-radius:50%;background:{{ s.dot }};flex:0 0 auto;\"><\u002Fspan>\n                  <div style=\"flex:1;min-width:0;\"><div style=\"font-size:14px;font-weight:500;\">{{ s.name }}<\u002Fdiv><div style=\"font-size:12px;color:#6d5a55;\">{{ s.note }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:clamp(28px,5vw,44px);background:#3b1f2b;color:#f3e9da;border-radius:30px;padding:clamp(24px,4vw,40px) clamp(22px,4vw,44px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 36px;\" data-reveal=\"\">\n      <div style=\"flex:1 1 360px;min-width:0;\">\n        <div style=\"font-family:Cormorant,serif;font-weight:400;font-size:clamp(30px,4vw,44px);line-height:1.05;text-wrap:balance;\">That's your whole night, <i style=\"color:#e8b9a8;\">handled.<\u002Fi><\u002Fdiv>\n        <div style=\"margin-top:8px;color:#e6d3d2;font-size:16px;\">First month free. Build <s style=\"opacity:.65;\">$99<\u002Fs> $69. Live this week.<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"{{ mainSiteUrl }}\" style=\"flex:0 0 auto;background:#e8b9a8;color:#3b1f2b;text-decoration:none;font-weight:600;font-size:17px;padding:18px 34px;border-radius:40px;box-shadow:0 14px 30px -12px rgba(232,185,168,.6);\" style-hover=\"background:#f3e9da;color:#3b1f2b;\">Set this up for my salon<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1140px;margin:0 auto;padding:clamp(16px,3vw,32px) 22px clamp(48px,8vw,80px);\">\n    <h2 style=\"font-family:Cormorant,serif;font-weight:400;font-size:clamp(40px,5.4vw,64px);line-height:1;max-width:15ch;text-wrap:balance;\" data-reveal=\"\">Your front desk, minus the <i style=\"color:#a44f33;\">front desk.<\u002Fi><\u002Fh2>\n    <div style=\"margin-top:clamp(28px,5vw,44px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:22px;\">\n      <div style=\"background:#ecd9c8;border-radius:200px 200px 26px 26px;padding:clamp(40px,7vw,58px) 26px 30px;text-align:center;\" data-reveal=\"\">\n        <div style=\"font-family:'Pinyon Script',cursive;font-size:44px;color:#a44f33;line-height:1;\">one<\u002Fdiv>\n        <h3 style=\"font-family:Cormorant,serif;font-weight:500;font-size:29px;line-height:1.1;margin:14px 0 10px;\">Books while your hands are full<\u002Fh3>\n        <p style=\"color:#6d5a55;font-size:15.5px;text-wrap:pretty;\">Mid-color, mid-cut, or fast asleep. It answers your website so nobody's left waiting.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#e7e1c9;border-radius:200px 200px 26px 26px;padding:clamp(40px,7vw,58px) 26px 30px;text-align:center;\" data-reveal=\"\" data-reveal-delay=\"120\">\n        <div style=\"font-family:'Pinyon Script',cursive;font-size:44px;color:#8a6a2a;line-height:1;\">two<\u002Fdiv>\n        <h3 style=\"font-family:Cormorant,serif;font-weight:500;font-size:29px;line-height:1.1;margin:14px 0 10px;\">Fills cancellations on its own<\u002Fh3>\n        <p style=\"color:#6d5a55;font-size:15.5px;text-wrap:pretty;\">Someone drops their 2pm? It offers the spot to your waitlist and fills it. Empty chairs stop costing you.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#dfe3d3;border-radius:200px 200px 26px 26px;padding:clamp(40px,7vw,58px) 26px 30px;text-align:center;\" data-reveal=\"\" data-reveal-delay=\"240\">\n        <div style=\"font-family:'Pinyon Script',cursive;font-size:44px;color:#5f6e51;line-height:1;\">three<\u002Fdiv>\n        <h3 style=\"font-family:Cormorant,serif;font-weight:500;font-size:29px;line-height:1.1;margin:14px 0 10px;\">Never guesses for you<\u002Fh3>\n        <p style=\"color:#6d5a55;font-size:15.5px;text-wrap:pretty;\">Only offers the times you've opened and the prices you've set. Anything else, it hands to you.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"offer\" style=\"max-width:1140px;margin:0 auto;padding:0 22px clamp(48px,8vw,80px);scroll-margin-top:80px;\">\n    <div style=\"background:#3b1f2b;color:#f3e9da;border-radius:36px;padding:clamp(26px,5vw,60px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:44px;align-items:center;\" data-reveal=\"\">\n      <div>\n        <div style=\"color:#d9b45a;letter-spacing:.5em;font-size:13px;\">✦ ☾ ✦<\u002Fdiv>\n        <h2 style=\"font-family:Cormorant,serif;font-weight:400;font-size:clamp(40px,5.2vw,62px);line-height:1;margin-top:18px;text-wrap:balance;\">Not another bill. <i style=\"color:#e8b9a8;\">A leg up.<\u002Fi><\u002Fh2>\n        <p style=\"margin-top:18px;color:#e6d3d2;font-size:17px;max-width:42ch;text-wrap:pretty;\">A custom site and booking setup can run into the thousands. This is the same kind of care, priced so a small studio can actually say yes. Built in your colors, added to your site, and looked after every month.<\u002Fp>\n        <p style=\"margin-top:14px;color:#cdb3b8;font-size:15px;\">No contract. No per-booking fees. Cancel anytime.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f3e9da;color:#3b1f2b;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:0;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding-bottom:20px;border-bottom:1px dashed #cdb697;\">\n          <div>\n            <div style=\"font-size:12.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#6d5a55;\">The build<\u002Fdiv>\n            <div style=\"font-size:14.5px;color:#6d5a55;margin-top:4px;\">Site + assistant, one time<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:right;\">\n            <div style=\"font-size:14px;color:#6d5a55;\"><s>$99<\u002Fs> <span style=\"background:#a44f33;color:#fbf6ee;font-weight:600;font-size:12px;padding:3px 8px;border-radius:12px;margin-left:4px;\">30% off<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:Cormorant,serif;font-weight:500;font-size:56px;line-height:1;\">$69<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding:20px 0;\">\n          <div>\n            <div style=\"font-size:12.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#6d5a55;\">Care &amp; hosting<\u002Fdiv>\n            <div style=\"font-size:14.5px;color:#6d5a55;margin-top:4px;\">Then $99/mo, cancel anytime<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:right;\">\n            <div style=\"font-size:14px;color:#5f6e51;font-weight:600;\">First month<\u002Fdiv>\n            <div style=\"font-family:Cormorant,serif;font-weight:500;font-size:56px;line-height:1;\">Free<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"{{ mainSiteUrl }}\" style=\"display:block;text-align:center;background:#a44f33;color:#fbf6ee;text-decoration:none;font-weight:500;font-size:16.5px;padding:16px 24px;border-radius:40px;\" style-hover=\"background:#3b1f2b;color:#f3e9da;\">Get this for my salon<\u002Fa>\n        <a href=\"#try\" style=\"display:block;text-align:center;margin-top:12px;font-size:14px;font-weight:500;\">Try the demo again<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid #e2d2bd;\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:30px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;color:#6d5a55;\">\n    <span>Rowan &amp; Sage is a demo studio. Your name, services and colors go here.<\u002Fspan>\n    <a href=\"{{ mainSiteUrl }}\" style=\"font-weight:500;\">Built with love by Precision Guesswork Technologies LLC<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mainSiteUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;}}\">\nclass Component extends DCLogic {\n  state = { msgs: [], chips: [], typing: false, notifs: [], clock: '11:47', day: 'Tuesday, March 11', ctx: {}, booked: false, cancelled: false, refill: null };\n  logRef = React.createRef();\n  run = 0;\n  componentDidMount() { this.go(() => this.start()); setTimeout(() => this.reveal(), 60); }\n  componentWillUnmount() { this.run++; this.io && this.io.disconnect(); }\n  componentDidUpdate() { const l = this.logRef.current; if (l) l.scrollTop = l.scrollHeight; }\n  go(fn) { fn().catch(() => {}); }\n  wait(ms) { const r = this.run; return new Promise((res, rej) => setTimeout(() => (r === this.run ? res() : rej('stale')), ms)); }\n  push(m) { this.setState(s => ({ msgs: [...s.msgs, m] })); }\n  chips(list) { this.setState({ chips: list }); }\n  notify(n) { this.setState(s => ({ notifs: [...s.notifs, n] })); }\n  async bot(text) { this.setState({ typing: true }); await this.wait(800); this.setState({ typing: false }); this.push({ isBot: true, text }); await this.wait(150); }\n  user(text) { this.chips([]); this.push({ isUsr: true, text }); }\n\n  async start() {\n    this.push({ isDiv: true, text: 'Tuesday, 11:47 PM, studio closed' });\n    await this.wait(300);\n    await this.bot(\"Hi there, welcome to Rowan & Sage. What can I book for you?\");\n    this.chips([{ t: 'Highlights', a: 'svc' }, { t: 'Cut & style', a: 'svc' }, { t: 'Facial', a: 'svc' }]);\n  }\n  async svc(t) {\n    this.user(t === 'Facial' ? 'Do you do facials?' : `I'd love ${t === 'Highlights' ? 'some highlights' : 'a ' + t.toLowerCase()}`);\n    this.setState(s => ({ ctx: { ...s.ctx, svc: t } }));\n    this.push({ isNote: true, text: 'Real openings from your book, never invented' });\n    await this.bot(\"Lovely. Maya has Friday at 2:00 or Saturday at 10:30. Which feels right?\");\n    this.chips([{ t: 'Friday 2:00', a: 'when' }, { t: 'Saturday 10:30', a: 'when' }]);\n  }\n  async when(t) {\n    this.user(t + ' please');\n    this.setState(s => ({ ctx: { ...s.ctx, when: t } }));\n    await this.bot(\"Perfect, I'll hold that for you. How would you like your confirmation, text or email?\");\n    this.chips([{ t: 'Text me', a: 'via' }, { t: 'Email me', a: 'via' }]);\n  }\n  async via(t) {\n    const email = t === 'Email me';\n    this.user(email ? 'Email is best' : 'Text is best');\n    this.setState(s => ({ ctx: { ...s.ctx, via: email ? 'email' : 'text', contact: email ? 'priya.m@gmail.com' : '(555) 555-0197' } }));\n    await this.bot(email ? \"Great. What's your name and email?\" : \"Great. What's your name and number?\");\n    this.chips([{ t: email ? 'Type name + email' : 'Type name + number', a: 'contact', hi: true }]);\n  }\n  async contact() {\n    const c = this.state.ctx;\n    this.user('Priya, ' + c.contact);\n    await this.bot(`You're booked, Priya! Your confirmation is on its way by ${c.via}. Can't wait to see you.`);\n    this.push({ isLead: true, text: 'Booking confirmed', rows: [{ k: 'Client', v: 'Priya' }, { k: 'Service', v: c.svc }, { k: 'With', v: 'Maya' }, { k: 'When', v: c.when }, { k: 'Confirmed by', v: c.via === 'email' ? 'Email' : 'Text' }] });\n    this.setState({ clock: '11:49', booked: true });\n    await this.wait(500);\n    this.notify({ title: 'New booking', time: 'now', body: `Priya · ${c.svc} with Maya · ${c.when}`, color: '#a44f33' });\n    await this.wait(700);\n    this.chips([{ t: 'Skip to next morning', a: 'morning', hi: true }]);\n  }\n  async morning() {\n    this.chips([]);\n    this.setState({ clock: '9:12', day: 'Wednesday, March 12', cancelled: true });\n    this.push({ isDiv: true, text: 'Wednesday, 9:12 AM, Jess cancels Thursday 11:00' });\n    await this.wait(400);\n    this.notify({ title: 'Cancellation', time: '9:12', body: 'Jess cancelled Thu 11:00 with Maya. Offering it to your waitlist.', color: '#8a6a5a' });\n    await this.bot(\"Morning Priya! A spot just opened with Maya tomorrow at 11:00. Want it instead?\");\n    this.chips([{ t: 'Yes, grab it', a: 'yes' }, { t: 'Keep my time', a: 'keep' }]);\n  }\n  async yes() {\n    this.user('Yes, grab it!');\n    this.setState({ refill: 'Priya' });\n    await this.bot(\"Done. You're in Thursday at 11:00, and your old slot is back open for someone else.\");\n    await this.wait(300);\n    this.notify({ title: 'Slot refilled', time: '9:14', body: 'Thu 11:00 is now Priya. Her old slot went to the waitlist. Zero empty chairs.', color: '#5f6e51' });\n    this.chips([{ t: 'Run it again', a: 'restart' }]);\n  }\n  async keep() {\n    this.user(\"I'll keep my time, thanks\");\n    this.setState({ refill: 'Dana' });\n    await this.bot(\"No problem, you're all set. I'll offer it to the next person on the waitlist.\");\n    await this.wait(300);\n    this.notify({ title: 'Slot refilled', time: '9:15', body: 'Thu 11:00 went to Dana from the waitlist. Zero empty chairs.', color: '#5f6e51' });\n    this.chips([{ t: 'Run it again', a: 'restart' }]);\n  }\n  restart = () => {\n    this.run++;\n    this.setState({ msgs: [], chips: [], typing: false, notifs: [], clock: '11:47', day: 'Tuesday, March 11', ctx: {}, booked: false, cancelled: false, refill: null }, () => this.go(() => this.start()));\n  };\n  choose(c) {\n    if (c.a === 'restart') return this.restart();\n    this.go(() => this[c.a](c.t));\n  }\n  reveal() {\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !window.IntersectionObserver) return;\n    this.io = new IntersectionObserver(es => es.forEach(e => {\n      if (!e.isIntersecting) return;\n      e.target.style.opacity = '1'; e.target.style.transform = 'none'; this.io.unobserve(e.target);\n    }), { threshold: 0.12 });\n    document.querySelectorAll('[data-reveal]').forEach(el => {\n      if (el.getBoundingClientRect().top < window.innerHeight * 0.9) return;\n      el.style.opacity = '0'; el.style.transform = 'translateY(36px)';\n      el.style.transition = 'opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1)';\n      el.style.transitionDelay = (el.getAttribute('data-reveal-delay') || 0) + 'ms';\n      this.io.observe(el);\n    });\n  }\n  rows() {\n    const { booked, cancelled, refill, ctx } = this.state;\n    const tone = { Confirmed: ['#e6ead9', '#4b5a3e'], New: ['#a44f33', '#fbf6ee'], Cancelled: ['#efe2d0', '#8a6a5a'], Moved: ['#e9c9a0', '#5a3f16'], 'From waitlist': ['#3b1f2b', '#f3e9da'], Refilled: ['#e6ead9', '#4b5a3e'] };\n    const r = [\n      { client: 'Ana', svc: 'Trim', who: 'Lena', when: 'Wed 10:00', status: 'Confirmed' },\n      { client: 'Jess', svc: 'Cut & style', who: 'Maya', when: 'Thu 11:00', status: cancelled ? 'Cancelled' : 'Confirmed' },\n      { client: 'Rosa', svc: 'Color', who: 'Lena', when: 'Fri 12:30', status: 'Confirmed' }\n    ];\n    if (booked) r.push({ client: 'Priya', svc: ctx.svc || 'Highlights', who: 'Maya', when: refill === 'Priya' ? 'Thu 11:00' : ctx.when, status: refill === 'Priya' ? 'Moved' : 'New', hot: true });\n    if (refill === 'Dana') r.push({ client: 'Dana', svc: 'Cut & style', who: 'Maya', when: 'Thu 11:00', status: 'From waitlist', hot: true });\n    return r.map(x => ({ ...x, bg: tone[x.status][0], fg: tone[x.status][1], strike: x.status === 'Cancelled' ? 'line-through' : 'none', rowBg: x.hot ? '#fbeee4' : 'transparent' }));\n  }\n  syncs() {\n    const { booked, refill } = this.state;\n    const on = '#5f6e51', off = '#cdb697';\n    return [\n      { name: 'Google Calendar', note: booked ? (refill ? 'Updated with the swap' : 'Added to Maya\\'s calendar') : 'Waiting for a booking', dot: booked ? on : off },\n      { name: 'Email to studio', note: booked ? 'Copy sent to the owner' : 'Waiting for a booking', dot: booked ? on : off },\n      { name: 'Text to Maya', note: booked ? 'Her new client, time and service' : 'Waiting for a booking', dot: booked ? on : off },\n      { name: 'Confirmation to Priya', note: booked ? (this.state.ctx.via === 'email' ? 'Emailed with time and address' : 'Texted with time and address') : 'Waiting for a booking', dot: booked ? on : off },\n      { name: 'Waitlist', note: refill ? 'Slot filled, nobody left hanging' : 'Standing by for cancellations', dot: refill ? on : off }\n    ];\n  }\n  renderVals() {\n    return {\n      msgs: this.state.msgs, typing: this.state.typing, notifs: this.state.notifs,\n      noNotifs: this.state.notifs.length === 0, clock: this.state.clock, day: this.state.day,\n      logRef: this.logRef, restart: this.restart,\n      chips: this.state.chips.map(c => ({ t: c.t, go: () => this.choose(c), bg: c.hi ? '#3b1f2b' : 'transparent', fg: c.hi ? '#f3e9da' : '#3b1f2b' })),\n      mainSiteUrl: this.props.mainSiteUrl || '#',\n      rows: this.rows(), syncs: this.syncs()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
